<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- DNS prefetch + preconnect for critical origins -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://near-by-dress.onrender.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://near-by-dress.onrender.com" crossorigin />

    <!--
      Load only Inter 400+600+700 and Outfit 600+700 (removed 300/500/800 unused weights).
      font-display=swap prevents invisible text during load (fixes LCP/FCP on mobile).
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;600;700&family=Outfit:wght@600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;600;700&family=Outfit:wght@600;700&display=swap" />
    </noscript>

    <meta name="description" content="NearByDress - Hyperlocal multi-vendor fashion marketplace. Discover local shops, browse products, and connect via WhatsApp." />
    <meta name="keywords" content="fashion, local shops, marketplace, boutique, ethnic wear, western wear" />
    <meta property="og:title" content="NearByDress - Local Fashion Marketplace" />
    <meta property="og:description" content="Discover local fashion shops near you and shop directly via WhatsApp." />
    <meta name="theme-color" content="#7b233d" />
    <title>NearByDress - Hyperlocal Fashion Marketplace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
