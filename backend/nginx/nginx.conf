# [ignoring loop detection]
# Optimized NGINX Reverse Proxy and Load Balancer Configuration for NearByDress.
# Features: Gzip compression, rate limiting, security headers, static file caching.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning & Log Optimization
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access_log.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Hide NGINX version info for security

    # Rate Limiting: 30 requests per minute per IP for sensitive endpoints
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    # Global Rate Limiting: 100 requests per second for standard endpoints
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=100r/s;

    # Gzip Compression for minimal latency
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.code
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # Backend Cluster Definition
    upstream api_servers {
        # Round-robin distribution across multiple cluster cores (PM2/Docker)
        server 127.0.0.1:5000;
        keepalive 32; # Keep-alive connection pooling
    }

    server {
        listen 80;
        server_name near-dress.onrender.com;

        # Force SSL redirection (uncomment if deploying directly to VPS with SSL)
        # return 301 https://$host$request_uri;

        # Core Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;

        # Static Assets Optimization (React Build Output)
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html; # Client-side react-router fallback

            # Cache HTML but force validation
            location ~* \.html$ {
                add_header Cache-Control "no-cache, public, must-revalidate, proxy-revalidate";
            }

            # Cache Static JS/CSS/Images for 1 Year (Immutable)
            location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|webp)$ {
                expires 1y;
                add_header Cache-Control "public, max-age=31536000, immutable";
                access_log off;
            }
        }

        # High-Speed API Reverse Proxying
        location /api/ {
            proxy_pass http://api_servers;
            proxy_http_version 1.1;

            # Upstream Connection Pooling parameters
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSockets Proxying Support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Apply Rate Limiting
            limit_req zone=global_limit burst=200 nodelay;

            # Buffer adjustments for larger uploads
            proxy_buffering on;
            proxy_buffers 16 16k;
            proxy_buffer_size 16k;
        }

        # Apply aggressive limits on Auth endpoints (DDoS prevention)
        location /api/auth/ {
            proxy_pass http://api_servers;
            limit_req zone=api_limit burst=10 nodelay;
        }
    }
}
